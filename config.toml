baseURL = "https://luodaoyi.com/"
title = "luodaoyi's Blog"
theme = "nengyong"
languageCode = "zh-CN"
languageName = "简体中文"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
copyright = "<a rel=\"license external nofollow noopener noreferrer\" href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh\" target=\"_blank\">CC BY-NC-SA 4.0</a>"
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
summaryLength = 120
mainSections = ["posts"]
capitalizeListTitles = false

[pagination]
  pagerSize = 20
  path = "page"

[permalinks]
  posts = "/posts/:slug/"
  categories = "/categories/:slug/"
  tags = "/tags/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[frontmatter]
  lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

[markup]
  defaultMarkdownHandler = "goldmark"

  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      table = true
      taskList = true
      typographer = false
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false

[related]
  threshold = 80
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 95
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[[menus.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1
  [menus.main.params]
    icon = "fa-solid fa-house"

[[menus.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 2
  [menus.main.params]
    icon = "fa-solid fa-book-open"

[[menus.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 3
  [menus.main.params]
    icon = "fa-solid fa-folder-tree"

[[menus.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 4
  [menus.main.params]
    icon = "fa-solid fa-tags"

[[menus.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 5
  [menus.main.params]
    icon = "fa-solid fa-user"

[[menus.main]]
  identifier = "kms"
  name = "KMS"
  url = "/posts/kms/"
  weight = 6
  [menus.main.params]
    icon = "fa-solid fa-key"

[[menus.main]]
  identifier = "keys"
  name = "激活"
  url = "/posts/keys/"
  weight = 7
  [menus.main.params]
    icon = "fa-solid fa-unlock-keyhole"

[params]
  version = "0.4.X"
  description = "精通ASM/C/C++/RUST/C#/Java/JavaScript/Python/Golang/ruby 的Hello World 编写。"
  keywords = ["技术博客", "Linux", "编程", "逆向", "网络", "Hugo"]
  defaultTheme = "auto"
  dateFormat = "2006.1.2"
  images = ["/apple-touch-icon.png"]
  capitalizeTitles = false
  withSiteTitle = true
  titleDelimiter = "|"
  indexWithSubtitle = false
  summaryPlainify = false

  [params.author]
    name = "luodaoyi"
    email = "luodaoyi@gmail.com"
    link = "https://luodaoyi.com/"
    avatar = "/apple-touch-icon.png"

  [params.gitInfo]
    repo = "https://github.com/luodaoyi/luodaoyi.github.io"
    branch = "main"
    dir = "content"
    issueTpl = "title=[Blog]%20{title}&body=|Field|Value|%0A|-|-|%0A|Title|{title}|%0A|URL|{URL}|%0A|Source|{sourceURL}|"

  [params.app]
    title = "luodaoyi's Blog"
    svgFavicon = ""

  [params.search]
    enable = false
    type = "fuse"
    contentLength = 4000
    maxResultLength = 10
    snippetLength = 50
    absoluteURL = false

  [params.header]
    desktopMode = "sticky"
    mobileMode = "auto"

    [params.header.title]
      logo = "/apple-touch-icon.png"
      name = "luodaoyi's Blog"
      typeit = false

    [params.header.subtitle]
      name = "能用就行"
      typeit = false

  [params.breadcrumb]
    enable = true
    sticky = false
    showHome = true
    capitalize = false

  [params.navigation]
    inSection = true
    reverse = false

  [params.footer]
    enable = true
    copyright = true
    author = true
    since = "2014"
    license = "<a rel=\"license external nofollow noopener noreferrer\" href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh\" target=\"_blank\">CC BY-NC-SA 4.0</a>"

    [params.footer.powered]
      enable = true
      hugoLogo = true
      themeLogo = true

  [params.section]
    paginate = 20

  [params.home]
    [params.home.profile]
      enable = false
    [params.home.posts]
      enable = true
      paginate = 20

  [params.social]
    GitHub = "luodaoyi"
    Email = "luodaoyi@gmail.com"
    RSS = true

  [params.busuanzi]
    enable = true
    siteViews = true
    pageViews = true

  [params.analytics]
    enable = true
    [params.analytics.google]
      id = "G-RETF4GNY56"
      anonymizeIP = true

  [params.page]
    authorAvatar = true
    hiddenFromHomePage = false
    hiddenFromSearch = false
    hiddenFromRelated = false
    lightgallery = false
    ruby = true
    fraction = true
    fontawesome = true
    license = "<a rel=\"license external nofollow noopener noreferrer\" href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\" target=\"_blank\">CC BY-NC-SA 4.0</a>"
    linkToMarkdown = true
    linkToSource = true
    linkToEdit = true
    linkToReport = true
    pageStyle = "normal"
    showLastmod = true
    wordCount = true
    readingTime = true
    collectionList = false
    collectionNavigation = false

    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
      position = "right"
      ordered = false
      startLevel = 2
      endLevel = 6

    [params.page.math]
      enable = true
      type = "katex"

    [params.page.related]
      enable = true
      count = 5
      position = ["footer"]

    [params.page.share]
      enable = true
      Twitter = true
      Facebook = false
      Linkedin = true
      Whatsapp = false
      Pinterest = false
      Tumblr = false
      HackerNews = true
      Reddit = false
      Buffer = false
      Weibo = true
      Pocket = true
      Evernote = false

    [params.page.comment]
      enable = true

      [params.page.comment.utterances]
        enable = true
        repo = "luodaoyi/blog-discussion"
        issueTerm = "pathname"
        label = ""
        lightTheme = "github-light"
        darkTheme = "github-dark"
