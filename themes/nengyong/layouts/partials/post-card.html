<article class="post-card">
  <h2 class="post-card-title">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h2>
  {{- partial "post-meta.html" (dict "page" . "showViews" false) -}}
  {{- with .Summary -}}
  <div class="post-card-summary">{{ . | plainify | htmlUnescape | truncate 180 }}</div>
  {{- end -}}
  {{- with .GetTerms "tags" -}}
  <div class="tag-list">
    {{- range . -}}
    <a class="tag" href="{{ .RelPermalink }}">{{ .Data.Term | default .Title }}</a>
    {{- end -}}
  </div>
  {{- end -}}
</article>
